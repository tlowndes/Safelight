name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Publish the installer as a preview release
        type: boolean
        default: true

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p safelight-core

  windows-build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: npm ci
      # Each build gets its own version (0.1.<run number>) so installed copies can tell an update is newer.
      - name: Set version
        shell: bash
        run: echo '{"version":"0.1.${{ github.run_number }}"}' > src-tauri/tauri.ci.json
      - run: npm run tauri build -- --config src-tauri/tauri.ci.json
      # The account's Actions storage can fill up, so a failed artefact upload shouldn't fail the build.
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          retention-days: 3
          name: safelight-windows-installer
          path: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
      # Run the workflow by hand to get a downloadable installer on the Releases page.
      - name: Publish preview release
        if: github.event_name == 'workflow_dispatch' && inputs.release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Safelight 0.1.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          files: |
            target/release/bundle/nsis/*.exe
            target/release/bundle/msi/*.msi
